version: '3.8'
services:
  postgres_db:
    image: postgres:15
    container_name: tourplanner-postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=docker
      - POSTGRES_DB=TourPlanner
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data

