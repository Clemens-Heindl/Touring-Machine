<div class="tour-list-container">
    <h2>Tours</h2>
    <ul class="tour-list">
    <li *ngFor="let tour of tours()" (click)="selectTour(tour)" [class.active]="tour.id === selectedTour()?.id">
        <h3>{{ tour.name }}</h3>
        <p>{{ tour.description }}</p>
        <button class="delete-btn" (click)="deleteTour(tour.id, $event)">Delete</button>
    </li>
    </ul>
<app-tour-form></app-tour-form>
