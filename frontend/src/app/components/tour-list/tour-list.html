<div class="tour-list-container">
    <div class="panel-heading">
        <div>
            <p class="eyebrow">Tours</p>
            <h2>Managed tour list</h2>
        </div>
        <button type="button" class="primary-btn" (click)="startCreateTour()">New tour</button>
    </div>
    
    <p class="status-note">{{ tourState.apiStatus() }}</p>
    
    <app-tour-form *ngIf="showForm" [tour]="editingTour" (saveTour)="saveTour($event)"
        (cancelEdit)="cancelForm()"></app-tour-form>
    
    <ul class="tour-list" *ngIf="tours().length > 0; else noTours">
        <li *ngFor="let tour of tours(); trackBy: trackTour" (click)="selectTour(tour)"
            [class.active]="tour.id === selectedTour()?.id" tabindex="0">
            <img [src]="tour.imageUrl" [alt]="tour.name + ' image'">
            <div class="tour-summary">
                <h3>{{ tour.name }}</h3>
                <p>{{ tour.from }} -> {{ tour.to }}</p>
                <div class="pill-row">
                    <span>{{ tour.transportType }}</span>
                    <span>{{ tour.distance }} km</span>
                    <span>{{ tourState.getPopularity(tour) }}</span>
                </div>
                </div>
                <div class="item-actions">
                    <button type="button" class="secondary-btn" (click)="startEditTour(tour, $event)">Edit</button>
                    <button type="button" class="danger-btn" (click)="deleteTour(tour.id, $event)">Delete</button>
                </div>
                </li>
    </ul>
<ng-template #noTours>
    <div class="empty-state">
        <h3>No tours found</h3>
        <p>Create a tour or clear the search field.</p>
    </div>
</ng-template>
</div>
