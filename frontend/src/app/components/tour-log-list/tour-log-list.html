<div class="tour-logs-container" *ngIf="selectedTour() as tour">
  <h3>Tour Logs for {{ tour.name }}</h3>
  <ul class="log-list">
    <li *ngFor="let log of tour.logs" class="log-item">
      <p>
        <strong>Date:</strong> {{ log.dateTime | date:'yyyy-MM-dd' }} | 
        <strong>Duration:</strong> {{ log.totalTime }} | 
        <strong>Difficulty:</strong> {{ log.difficulty }}/5 | 
        <strong>Rating:</strong> {{ log.rating }}/5
      </p>
      <p>{{ log.comment }}</p>
      <button class="delete-btn" (click)="deleteLog(log, $event)">Delete</button>
    </li>
    <li *ngIf="tour.logs.length === 0">No logs yet for this tour.</li>
  </ul>
  <app-tour-log-form></app-tour-log-form>
</div>
