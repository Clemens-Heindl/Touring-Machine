<div class="import-export-container">
  <h1>Import / Export</h1>
  
  <div class="section">
    <h2>Export Tours</h2>
    <p>Export all tours and logs to a file</p>
    <button class="btn btn-primary">Export as JSON</button>
    <button class="btn btn-primary">Export as CSV</button>
  </div>

  <div class="section">
    <h2>Import Tours</h2>
    <p>Import tours and logs from a file</p>
    <input type="file" accept=".json,.csv" />
    <button class="btn btn-primary">Import</button>
  </div>
</div>
