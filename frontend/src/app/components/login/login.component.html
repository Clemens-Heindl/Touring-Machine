<section class="login-card">
  <h2>{{ isRegisterMode ? 'Create account' : 'Sign in' }}</h2>
  @if (isRegisterMode) {
    <label for="name">Name</label>
    <input id="name" type="text" [(ngModel)]="name" placeholder="Your name" />
  }
  <label for="email">Email</label>
  <input id="email" type="email" [(ngModel)]="email" placeholder="user@example.com" />

  <label for="password">Password</label>
  <input id="password" type="password" [(ngModel)]="password" placeholder="Enter your password" />

  <button type="button" class="primary-btn" (click)="submit()" [disabled]="isLoading">
    {{ isLoading ? (isRegisterMode ? 'Creating account...' : 'Signing in...') : (isRegisterMode ? 'Create account' : 'Sign in') }}
  </button>

  @if (errorMessage) {
    <p class="error-message">{{ errorMessage }}</p>
  }
</section>
