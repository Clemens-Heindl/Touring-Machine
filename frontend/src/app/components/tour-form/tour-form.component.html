<form class="editor-form" [formGroup]="tourForm" (ngSubmit)="onSubmit()" novalidate>
  <div class="form-heading">
    <h3>{{ isEditing ? 'Edit tour' : 'Create tour' }}</h3>
    <p>All tour attributes are bound to the Angular view model.</p>
  </div>

  <label>
    Name
    <input formControlName="name" placeholder="River Loop Ride">
    <span class="field-error" *ngIf="hasError('name')">Name is required.</span>
  </label>

  <label>
    Description
    <textarea formControlName="description" rows="3" placeholder="Short tour description"></textarea>
    <span class="field-error" *ngIf="hasError('description')">Description is required.</span>
  </label>

  <div class="form-grid">
    <label>
      From
      <input formControlName="from" placeholder="Start location">
      <span class="field-error" *ngIf="hasError('from')">Start location is required.</span>
    </label>

    <label>
      To
      <input formControlName="to" placeholder="Destination">
      <span class="field-error" *ngIf="hasError('to')">Destination is required.</span>
    </label>
  </div>

  <div class="form-grid">
    <label>
      Transport type
      <select formControlName="transportType">
        <option *ngFor="let type of transportTypes" [value]="type">{{ type }}</option>
      </select>
    </label>

    <label>
      Distance in km
      <input type="number" min="0.1" step="0.1" formControlName="distance">
      <span class="field-error" *ngIf="hasError('distance')">Distance must be greater than 0.</span>
    </label>
  </div>

  <div class="form-grid">
    <label>
      Estimated time
      <input formControlName="estimatedTime" placeholder="02:10:00">
      <span class="field-error" *ngIf="hasError('estimatedTime')">Use hh:mm or hh:mm:ss.</span>
    </label>

    <label>
      Image URL
      <input formControlName="imageUrl" placeholder="https://example.com/tour.jpg">
      <span class="field-error" *ngIf="hasError('imageUrl')">Image URL is required.</span>
    </label>
  </div>

  <label>
    Route information
    <textarea formControlName="routeInformation" rows="2"
      placeholder="Harbor Park -> River Trail -> Quarry Bend"></textarea>
    <span class="field-error" *ngIf="hasError('routeInformation')">Route information is required.</span>
  </label>

  <div class="button-row">
    <button type="submit" class="primary-btn">{{ isEditing ? 'Save tour' : 'Create tour' }}</button>
    <button type="button" class="secondary-btn" *ngIf="isEditing" (click)="cancel()">Cancel</button>
  </div>
</form>
