<form class="editor-form compact" [formGroup]="logForm" (ngSubmit)="onSubmit()" novalidate>
  <div class="form-heading">
    <h3>{{ isEditing ? 'Edit log' : 'Create log' }}</h3>
    <p>Every log belongs to the currently selected tour.</p>
  </div>

  <label>
    Date and time
    <input type="datetime-local" formControlName="dateTime">
    <span class="field-error" *ngIf="hasError('dateTime')">Date and time are required.</span>
  </label>

  <label>
    Comment
    <textarea rows="2" formControlName="comment" placeholder="How did the tour go?"></textarea>
    <span class="field-error" *ngIf="hasError('comment')">Comment is required.</span>
  </label>

  <div class="form-grid three">
    <label>
      Difficulty
      <input type="number" min="1" max="5" formControlName="difficulty">
      <span class="field-error" *ngIf="hasError('difficulty')">Use 1 to 5.</span>
    </label>

    <label>
      Distance in km
      <input type="number" min="0.1" step="0.1" formControlName="totalDistance">
      <span class="field-error" *ngIf="hasError('totalDistance')">Distance must be greater than 0.</span>
    </label>

    <label>
      Rating
      <input type="number" min="1" max="5" formControlName="rating">
      <span class="field-error" *ngIf="hasError('rating')">Use 1 to 5.</span>
    </label>
  </div>

  <label>
    Total time
    <input formControlName="totalTime" placeholder="02:18:00">
    <span class="field-error" *ngIf="hasError('totalTime')">Use hh:mm or hh:mm:ss.</span>
  </label>

  <div class="button-row">
    <button type="submit" class="primary-btn">{{ isEditing ? 'Save log' : 'Add log' }}</button>
    <button type="button" class="secondary-btn" *ngIf="isEditing" (click)="cancel()">Cancel</button>
  </div>
</form>
