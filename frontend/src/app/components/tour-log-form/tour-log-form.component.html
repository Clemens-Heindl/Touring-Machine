<form class="editor-form compact" [formGroup]="logForm" (ngSubmit)="onSubmit()" novalidate>

  <div class="form-heading">
    <span class="eyebrow">{{ isEditing ? 'Editing log' : 'New log' }}</span>
    <h3>{{ isEditing ? 'Edit log entry' : 'Add a log entry' }}</h3>
  </div>

  <label>
    Date and time
    <input type="datetime-local" formControlName="dateTime">
    @if (hasError('dateTime')) {
      <span class="field-error">Date and time are required.</span>
    }
  </label>

  <label>
    Comment
    <textarea rows="3" formControlName="comment" placeholder="How did the tour go?"></textarea>
    @if (hasError('comment')) {
      <span class="field-error">Comment is required.</span>
    }
  </label>

  <div class="form-grid two-columns">
    <div class="star-group">
      <span class="star-group-label">Difficulty</span>
      <div class="star-rater" role="group" aria-label="Difficulty rating">
        @for (star of [1, 2, 3, 4, 5]; track star) {
          <button type="button" class="star-btn"
                  [class.filled]="difficultyValue >= star"
                  (click)="setDifficulty(star)"
                  [attr.aria-label]="'Difficulty ' + star + ' of 5'">★</button>
        }
      </div>
      <span class="star-count">{{ difficultyValue }} / 5</span>
    </div>

    <div class="star-group">
      <span class="star-group-label">Rating</span>
      <div class="star-rater" role="group" aria-label="Overall rating">
        @for (star of [1, 2, 3, 4, 5]; track star) {
          <button type="button" class="star-btn"
                  [class.filled]="ratingValue >= star"
                  (click)="setRating(star)"
                  [attr.aria-label]="'Rating ' + star + ' of 5'">★</button>
        }
      </div>
      <span class="star-count">{{ ratingValue }} / 5</span>
    </div>
  </div>

  <div class="form-grid two-columns">
    <label>
      Distance (km)
      <input type="number" min="0.1" step="0.1" formControlName="totalDistance">
      @if (hasError('totalDistance')) {
        <span class="field-error">Distance must be greater than 0.</span>
      }
    </label>

    <label>
      Total time
      <input formControlName="totalTime" placeholder="02:18:00">
      @if (hasError('totalTime')) {
        <span class="field-error">Use hh:mm or hh:mm:ss.</span>
      }
    </label>
  </div>

  <div class="button-row form-actions">
    <button type="submit" class="primary-btn">{{ isEditing ? 'Save log' : 'Add log' }}</button>
    <button type="button" class="secondary-btn" (click)="cancel()">Cancel</button>
  </div>

</form>
