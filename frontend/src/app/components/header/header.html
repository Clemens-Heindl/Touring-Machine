<header class="header">
    <div class="brand-lockup">
        <div class="brand-mark">TM</div>
        <div>
            <p class="eyebrow">Touring Machine</p>
            <h1>Tour Planner</h1>
        </div>
    </div>
    <div class="search-bar">
        <label for="global-search">Search tours and logs</label>
        <input id="global-search" type="search" placeholder="Name, location, rating, child-friendly..."
            [ngModel]="tourState.searchTerm$()" (ngModelChange)="updateSearch($event)" />
    </div>
    <div class="user-actions">
        <button type="button" class="secondary-btn">Import</button>
        <button type="button" class="secondary-btn">Export</button>
    </div>
</header>
