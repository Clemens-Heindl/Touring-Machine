<header class="header">
    <div class="brand-lockup">
        <h1>Touring Machine</h1>
    </div>
    <div class="search-bar">
        <label for="global-search">Search tours and logs</label>
        <input id="global-search" type="search" placeholder="Name, location, rating, child-friendly..."
            [ngModel]="tourState.searchTerm$()" (ngModelChange)="updateSearch($event)" />
    </div>
    @if (isLoggedIn) {
        <div class="user-actions">
            <div class="user-box">
                <span class="user-label">Signed in as {{ userState.currentUser$()?.name }}</span>
                <button type="button" class="secondary-btn" (click)="logout()">Logout</button>
            </div>
        </div>
    } @else {
        <div class="auth-buttons">
            <button type="button" class="secondary-btn" (click)="openLogin()">Login</button>
            <button type="button" class="secondary-btn" (click)="openRegister()">Register</button>
        </div>
    }
    <div class="login-panel" [hidden]="!showAuthPanel || isLoggedIn">
      <app-login [mode]="authMode"></app-login>
    </div>
</header>
